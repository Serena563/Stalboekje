<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stalboekje</title>
<style>
:root{
  --bg:#f3f1e8; --card:#fffdf7; --ink:#2c3326; --soft:#5f6857; --line:#ddd8c6;
  --moss:#5b7042; --moss-d:#43552f; --moss-l:#e5ebd9;
  --ok:#2f7d43; --ok-bg:#dcecdd; --mid:#9a7a08; --mid-bg:#f3e8c4; --bad:#b8352b; --bad-bg:#f6dfdc;
}
*{box-sizing:border-box}
html{font-size:19px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 120px}
h1{font-size:1.35rem;margin:6px 0 12px;color:var(--moss-d)}
h2{font-size:1.15rem;margin:22px 0 8px;color:var(--moss-d)}
p{margin:6px 0}
.muted{color:var(--soft);font-size:.9rem}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tab{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 4px;font-size:.85rem;font-weight:600;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:68px;justify-content:center}
.tab .ic{font-size:1.5rem;line-height:1}
.tab.on{background:var(--moss);border-color:var(--moss);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.group-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 0 6px}
.group-h h2{margin:0}
.horse{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.horse:hover{border-color:var(--moss)}
.horse .nm{font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.horse .sx{font-size:1.2rem;width:1.4em;text-align:center}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:600;background:var(--moss-l);color:var(--moss-d);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.mid{background:var(--mid-bg);color:var(--mid)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
button.big,a.big{display:block;width:100%;border:none;border-radius:14px;background:var(--moss);color:#fff;font:inherit;font-weight:700;padding:15px 16px;margin:10px 0;cursor:pointer;text-align:center;text-decoration:none}
button.big:hover{background:var(--moss-d)}
button.big.light{background:var(--moss-l);color:var(--moss-d)}
button.big.red{background:var(--bad-bg);color:var(--bad)}
button.small{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font:inherit;font-size:.9rem;cursor:pointer;color:var(--ink)}
button.link{border:none;background:none;color:var(--moss-d);text-decoration:underline;font:inherit;font-size:.9rem;padding:6px 0;cursor:pointer}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid #c9c3ae;border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:80px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.seg button.on{border-color:var(--moss);background:var(--moss-l);color:var(--moss-d)}
.stal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.stal.best{border:2px solid var(--ok)}
.stal .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.stal .nm{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.stal .sdg{font-weight:800;font-size:1.15rem;color:var(--moss-d);white-space:nowrap}
.stal .info{margin:6px 0;color:var(--soft);font-size:.92rem}
.stal.fam{opacity:.75}
.back{margin:4px 0 8px}
.empty{text-align:center;color:var(--soft);padding:24px 10px;background:var(--card);border:1px dashed var(--line);border-radius:14px;margin:12px 0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--moss-d);color:#fff;padding:14px 20px;border-radius:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:92vw;z-index:20;text-align:center}
.days{font-weight:800;font-size:1.1rem}
.ver{text-align:center;color:var(--soft);font-size:.75rem;margin-top:30px}
.tree{font-size:.92rem;line-height:1.7}
.tree .lv1{margin-left:0}.tree .lv2{margin-left:1.2em}.tree .lv3{margin-left:2.4em}
.search{margin:8px 0 4px}
.tabs{grid-template-columns:repeat(5,1fr);gap:6px}
.tab{white-space:nowrap;padding:8px 2px}
@media (max-width:420px){.tab{font-size:.72rem}}
details.uitleg{background:var(--moss-l);border-radius:12px;padding:10px 14px;margin:10px 0}
details.uitleg summary{font-weight:700;cursor:pointer;color:var(--moss-d)}
details.uitleg ul{margin:6px 0;padding-left:1.2em}
.nivs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.niv{font-weight:400;margin:0}.niv span{display:block;font-size:.85rem;color:var(--soft)}
.horse .sub{display:block;margin-top:4px;font-weight:400}
.horse .sub .pill{white-space:normal}
.info .pill{margin-right:4px}
.ov{position:fixed;inset:0;background:rgba(30,35,25,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.dlg{background:var(--card);border-radius:16px;padding:18px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg p{font-size:1.02rem;margin:0 0 6px;white-space:pre-line}
@media (max-width:420px){html{font-size:18px}.tab{font-size:.78rem}}
</style>
</head>

function bare(n){return norm(String(n||"").replace(/\s*\([^)]*\)\s*$/,""))}
function undeco(n){return bare(String(n||"").replace(/\s*\([^)]*\)\s*$/,"").replace(/[\s*✨★☆⭐]+$/,""))}

function byName(){

  function put(h,src){var k=bare(h.name);if(!k)return;var L=m.get(k);if(!L){L=[];m.set(k,L)}L.push({h:h,src:src})}
  D.horses.forEach(function(h){put(h,0)});D.ped.forEach(function(h){put(h,1)});D.db.forEach(function(h){put(h,2)});
  return m;
}

  var L=map.get(bare(name))||map.get(undeco(name));if(!L||!L.length)return null;if(L.length===1)return L[0].h;
  var hint=hintOf(name),own=L.find(function(c){return c.src===0&&c.h.stalnaam});
  var score=function(c){var h=c.h,sc=0;
    if(hint&&(norm(h.stalnaam)===hint||norm(h.stal)===hint))sc+=100;
    if(own&&c.src>0&&h.stalnaam&&norm(h.stalnaam)!==norm(own.h.stalnaam))sc-=50;
    sc+=(2-c.src)*5;sc+=(h.sire?15:0)+(h.dam?15:0);return sc};
  return L.slice().sort(function(a,b){return score(b)-score(a)})[0].h;
}

  var known=0;(function walk(nm,d){if(d>3)return;var h=find(map,nm);if(!h)return;
    [h.sire,h.dam].forEach(function(x){if(x){known++;walk(x,d+1)}})})(name,1);

function ancestors(name,map,maxD){
  var out=new Map();
  (function walk(nm,d){
    if(!nm||d>maxD)return;var k=undeco(nm);if(!k)return;
    var e=out.get(k);if(!e){e={name:nm,depths:[]};out.set(k,e)}e.depths.push(d);

  var a=ancestors(sireName,map,3),b=ancestors(damName,map,3),F=0,shared=[];
  a.forEach(function(pa,k){var pb=b.get(k);if(!pb)return;var v=0;pa.depths.forEach(function(x){pb.depths.forEach(function(y){v+=Math.pow(.5,x+y+1)})});F+=v;shared.push({name:pa.name,v:v})});
  shared.sort(function(x,y){return y.v-x.v});
  return {F:F,shared:shared};
}
function relation(st,mare,map){
  var same=function(a,b){return a&&b&&norm(a)===norm(b)};
  if(same(mare.sire,st.name))return "vader van "+mare.name;
  if(same(st.dam,mare.name))return "zoon van "+mare.name;
  var bs=same(st.sire,mare.sire),bd=same(st.dam,mare.dam);
  if(bs&&bd)return "volle broer van "+mare.name;
  if(bs||bd)return "halfbroer van "+mare.name;
  var ms=find(map,mare.sire),md=find(map,mare.dam);
  if((ms&&same(ms.sire,st.name))||(md&&same(md.sire,st.name)))return "opa van "+mare.name;
  return null;
}
function coiPill(F){

  if(F<=.125)return '<span class="pill mid">'+p.toLocaleString("nl-NL")+'% inteelt</span>';

/* ============ Dropbox ============ */
var DBX_KEY="kjix20vl6p7ds71", DBX_PATH="/stalboekje.json", DBX_TOK="stalboekje-dbx", DBX_SYNCED="stalboekje-dbx-synced", DBX_VER="stalboekje-dbx-verifier";
var DBX={busy:false,msg:"",err:"",last:0,timer:null};
function dbxTokens(){try{return JSON.parse(localStorage.getItem(DBX_TOK)||"null")}catch(e){return null}}
function dbxSetTokens(t){try{if(t)localStorage.setItem(DBX_TOK,JSON.stringify(t));else localStorage.removeItem(DBX_TOK)}catch(e){}}
function dbxOn(){var t=dbxTokens();return !!(t&&t.refresh_token)}
function dbxSynced(){try{return +localStorage.getItem(DBX_SYNCED)||0}catch(e){return 0}}
function dbxSetSynced(v){try{localStorage.setItem(DBX_SYNCED,String(v))}catch(e){}}
function dbxRedirect(){return location.origin+location.pathname}
function b64url(buf){var s="",b=new Uint8Array(buf);for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function dbxConnect(){
  var r=new Uint8Array(48);crypto.getRandomValues(r);var ver=b64url(r);
  try{localStorage.setItem(DBX_VER,ver)}catch(e){}
  var ch=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(ver)));
  var q=new URLSearchParams({client_id:DBX_KEY,response_type:"code",code_challenge:ch,code_challenge_method:"S256",token_access_type:"offline",redirect_uri:dbxRedirect()});
  location.href="https://www.dropbox.com/oauth2/authorize?"+q.toString();
}
async function dbxErrText(res){try{var t=await res.text();try{var j=JSON.parse(t);return j.error_summary||j.error_description||t}catch(e){return t}}catch(e){return res.statusText}}
async function dbxFinishLogin(code){
  var ver="";try{ver=localStorage.getItem(DBX_VER)||""}catch(e){}
  var res=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({code:code,grant_type:"authorization_code",client_id:DBX_KEY,code_verifier:ver,redirect_uri:dbxRedirect()}).toString()});
  if(!res.ok)throw new Error("Inloggen bij Dropbox lukte niet ("+res.status+"): "+await dbxErrText(res));
  var o=await res.json();dbxSetTokens({access_token:o.access_token,refresh_token:o.refresh_token,expires_at:Date.now()+(o.expires_in-60)*1000});
  try{localStorage.removeItem(DBX_VER)}catch(e){}
}
async function dbxToken(){
  var t=dbxTokens();if(!t)throw new Error("Niet verbonden met Dropbox.");
  if(t.access_token&&t.expires_at>Date.now())return t.access_token;
  var res=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({grant_type:"refresh_token",refresh_token:t.refresh_token,client_id:DBX_KEY}).toString()});
  if(!res.ok){if(res.status===400||res.status===401){dbxSetTokens(null);throw new Error("De koppeling met Dropbox is verlopen. Verbind opnieuw.")}throw new Error("Dropbox reageert niet ("+res.status+").")}
  var o=await res.json();t.access_token=o.access_token;t.expires_at=Date.now()+(o.expires_in-60)*1000;dbxSetTokens(t);return t.access_token;
}
async function dbxDownload(){
  var tok=await dbxToken();
  var res=await fetch("https://content.dropboxapi.com/2/files/download",{method:"POST",headers:{Authorization:"Bearer "+tok,"Dropbox-API-Arg":JSON.stringify({path:DBX_PATH})}});
  if(res.status===409){var e=await dbxErrText(res);if(String(e).indexOf("not_found")>=0)return null;throw new Error("Ophalen uit Dropbox lukte niet: "+e)}
  if(!res.ok)throw new Error("Ophalen uit Dropbox lukte niet ("+res.status+").");
  return JSON.parse(await res.text());
}
async function dbxUpload(data){
  var tok=await dbxToken();
  var res=await fetch("https://content.dropboxapi.com/2/files/upload",{method:"POST",headers:{Authorization:"Bearer "+tok,"Dropbox-API-Arg":JSON.stringify({path:DBX_PATH,mode:"overwrite",mute:true}),"Content-Type":"application/octet-stream"},body:JSON.stringify(data)});
  if(!res.ok)throw new Error("Opslaan in Dropbox lukte niet ("+res.status+"): "+await dbxErrText(res));
}
function dbxApply(x){
  try{localStorage.setItem("stalboekje-voor-dropbox",localStorage.getItem(KEY)||"")}catch(e){}
  x.db=x.db||[];x.ped=x.ped||[];x.rassen=x.rassen||["fries"];D=x;
  try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}
  dbxSetSynced(D.t||0);
}
async function dbxSync(){
  if(!dbxOn()||DBX.busy)return;DBX.busy=true;DBX.err="";dbxBar();
  try{
    var remote=await dbxDownload(),lt=D.t||0,synced=dbxSynced();
    if(!remote){await dbxUpload(D);dbxSetSynced(lt)}
    else{
      var rt=remote.t||0,lh=(D.horses||[]).length,rh=(remote.horses||[]).length;
      if(rt===lt){dbxSetSynced(lt)}
      else if(!synced){
        if(!lh&&!D.db.length){dbxApply(remote);render()}
        else if(!rh&&!(remote.db||[]).length){await dbxUpload(D);dbxSetSynced(lt)}
        else{DBX.busy=false;dbxConflict(remote);return}
      }else{
        var lc=lt>synced,rc=rt>synced;
        if(lc&&rc){DBX.busy=false;dbxConflict(remote);return}
        if(rc){dbxApply(remote);render()}
        else if(lc){await dbxUpload(D);dbxSetSynced(lt)}
      }
    }
    DBX.last=Date.now();
  }catch(e){DBX.err=e.message||"Er ging iets mis met Dropbox."}
  DBX.busy=false;dbxBar();if(S.tab==="backup"&&!S.edit)render();
}
function dbxConflict(remote){
  dialog("Er is iets veranderd op dit apparaat én op een ander apparaat. Welke wil je houden?\n\nDit apparaat: "+D.horses.length+" paarden\nDropbox: "+(remote.horses||[]).length+" paarden",[
    {t:"Die van dit apparaat",f:function(){DBX.busy=true;dbxUpload(D).then(function(){dbxSetSynced(D.t||0);DBX.last=Date.now()}).catch(function(e){DBX.err=e.message}).then(function(){DBX.busy=false;dbxBar();render()})}},
    {t:"Die uit Dropbox",cls:"light",f:function(){dbxApply(remote);DBX.last=Date.now();dbxBar();render()}}]);
}
function dbxLater(){if(!dbxOn())return;clearTimeout(DBX.timer);DBX.timer=setTimeout(dbxSync,2000)}
function dbxBar(){
  var el=document.getElementById("cloud");if(!el)return;
  if(!dbxOn()){el.innerHTML="";return}
  el.innerHTML=DBX.err?'<span class="pill bad" onclick="go(\'backup\')">☁️ Dropbox: probleem, tik hier</span>':DBX.busy?'<span class="pill">☁️ Bezig met Dropbox…</span>':'<span class="pill ok">☁️ Dropbox ✓</span>';
}
function dbxDisconnect(){ask("Dropbox loskoppelen? Je paarden blijven op dit apparaat staan.","Ja, loskoppelen",function(){dbxSetTokens(null);dbxSetSynced(0);DBX.err="";dbxBar();render()})}
function viewDropbox(){
  var html='<h2>☁️ Dropbox</h2><div class="card">';
  if(!dbxOn()){
    html+='<p>Met Dropbox staan je paarden veilig in je eigen Dropbox, en zie je dezelfde paarden op je telefoon, tablet en computer.</p>';
    if(DBX.err)html+='<p class="pill bad">'+esc(DBX.err)+'</p>';
    html+='<button class="big" onclick="dbxConnect()">Verbinden met Dropbox</button><p class="muted">Je logt in met je eigen Dropbox. Doe dit op elk apparaat waarop je het Stalboekje gebruikt.</p>';
  }else{
    html+='<p>✓ Verbonden. Alles wat je verandert gaat vanzelf naar Dropbox.</p>';
    if(DBX.err)html+='<p class="pill bad" style="white-space:normal">'+esc(DBX.err)+'</p>';
    else if(DBX.last)html+='<p class="muted">Laatst bijgewerkt om '+new Date(DBX.last).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"})+'.</p>';
    html+='<button class="big light" onclick="dbxSync()">🔄 Nu bijwerken</button><button class="link" onclick="dbxDisconnect()">Loskoppelen</button>';
  }
  return html+'</div>';
}
async function dbxStart(){
  var u=new URL(location.href),code=u.searchParams.get("code"),err=u.searchParams.get("error");
  if(code||err){u.searchParams.delete("code");u.searchParams.delete("state");u.searchParams.delete("error");u.searchParams.delete("error_description");history.replaceState({},"",u.pathname+u.search+u.hash)}
  if(code){try{await dbxFinishLogin(code);toast("Verbonden met Dropbox ✓")}catch(e){DBX.err=e.message}}
  if(err)DBX.err="Verbinden met Dropbox is afgebroken.";
  dbxBar();if(dbxOn())dbxSync();

  var map=byName(),msdg=sdgOf(mare);
  var rows=stallions().map(function(x){
    var st=x.h,c=coi(st.name,mare.name,map),rel=relation(st,mare,map);
    var stDb=find(map,st.name)||st;
    return {x:x,st:st,stDb:stDb,known:pedKnown(st.name,map),F:c.F,shared:c.shared,rel:rel,sdg:sdgOf(st),onbekend:!(stDb.sire||stDb.dam)};
  });
  var q=norm(S.q);if(q)rows=rows.filter(function(r){return norm(r.st.name).indexOf(q)>=0||norm(r.st.stal).indexOf(q)>=0});
  rows.sort(function(a,b){var fa=a.rel||a.F>0?1:0,fb=b.rel||b.F>0?1:0;return fa-fb||(b.sdg||0)-(a.sdg||0)});
  var html='<button class="link back" onclick="S.mare=null;S.q=\'\';render()">← Andere merrie kiezen</button>';
  html+='<div class="card"><b>♀ '+esc(mare.name)+'</b> · '+f1(msdg)+' SDG<div class="info">'+fokLine(mare,false)+'</div>'+(mare.sire||mare.dam?'<br><span class="muted">'+esc(mare.sire||"?")+' × '+esc(mare.dam||"?")+'</span>':'<br><span class="muted">Ouders niet ingevuld, dus de inteelt kan niet goed berekend worden.</span>')+(function(){var k=pedKnown(mare.name,map);return (mare.sire||mare.dam)&&k<14?'<div class="info"><span class="pill mid">Stamboom '+k+' van 14 bekend</span> De inteelt kan hoger zijn dan hier staat. Plak de stamboom van '+esc(mare.name)+' bij 📋 Plakken.</div>':''})()+'</div>';
  html+='<input class="search" placeholder="🔍 Zoek een hengst of stal…" value="'+esc(S.q)+'" oninput="S.q=this.value;var p=this.selectionStart;render();var e=document.querySelector(\'.search\');e.focus();e.setSelectionRange(p,p)">';
  if(!rows.length)return html+'<div class="empty">Geen dekhengsten gevonden.<br>Lees bij <b>💾 Back-up</b> het hengstenbestand in.</div>';
  html+='<p class="muted">Bovenaan staan de hengsten zonder inteelt, de hoogste SDG eerst.</p>';
  S.rows=rows;
  rows.forEach(function(r,i){
    var fam=r.rel||r.F>0,veulen=(r.sdg!==null&&msdg!==null)?(r.sdg+msdg)/2:null;
    html+='<div class="stal'+(i===0&&!fam?" best":"")+(fam?" fam":"")+'"><div class="top"><span class="nm">♂ '+esc(r.st.name)+'</span><span class="sdg">'+f1(r.sdg)+'</span></div>';
    html+='<div class="info">'+(r.x.eigen?"Eigen hengst":(r.st.stal?"Stal: "+esc(r.st.stal):""))+(r.st.dekgeld?" · Dekgeld: "+esc(r.st.dekgeld):"")+'</div>';
    html+='<div>'+coiPill(r.F)+' '+fokLine(r.st.niv||r.st.fok?r.st:r.stDb,true)+(r.rel?' <span class="pill bad">⚠️ '+esc(r.rel)+'</span>':'')+'</div>';
    if(r.F>0&&r.shared.length)html+='<div class="info">Zelfde voorouder: '+r.shared.slice(0,2).map(function(s){return esc(s.name)}).join(", ")+'</div>';
    if(r.onbekend)html+='<div class="info">Stamboom van deze hengst is onbekend.</div>';
    else if(r.known<14)html+='<div class="info">Stamboom van de hengst: '+r.known+' van 14 voorouders bekend.</div>';
    if(veulen!==null)html+='<div class="info">Veulen wordt minstens ongeveer <b>'+f1(veulen)+'</b> SDG</div>';
    html+='<button class="big" onclick="kiesHengst('+i+')">Gedekt met '+esc(r.st.name)+'</button></div>';
  });
  return html;
}
function kiesHengst(i){S.dek=S.rows[i].st.name;render();window.scrollTo(0,0)}
function viewDekBevestig(){
  var mare=D.horses.find(function(h){return h.id===S.mare});
  var html='<button class="link back" onclick="S.dek=null;render()">← Terug</button><div class="card"><h2 style="margin-top:0">💞 '+esc(mare.name)+' × '+esc(S.dek)+'</h2>';
  html+='<label>Wanneer gedekt?</label><input type="date" id="f-dekdatum" value="'+today()+'">';
  html+='<p class="muted">De app rekent '+DRACHT_DAGEN+' dagen dracht. Je kunt de bevaldatum later nog aanpassen.</p>';
  html+='<button class="big" onclick="bevestigDek()">✓ Ja, ze is gedekt</button></div>';
  return html;
}
function bevestigDek(){
  var mare=D.horses.find(function(h){return h.id===S.mare});var d=val("f-dekdatum")||today();
  mare.drachtMet=S.dek;mare.dekDatum=d;mare.bevalDatum=addDays(d,DRACHT_DAGEN);delete mare.datumGok;
  save();toast(mare.name+" is gedekt 💞");go("dracht");
}

/* ---- Drachtig ---- */
function viewDracht(){
  var list=D.horses.filter(function(h){return h.bevalDatum}).sort(function(a,b){return a.bevalDatum.localeCompare(b.bevalDatum)});
  var html='<h2>Drachtige merries</h2><p class="muted">De fokbonus telt op de dag van de bevalling. Haalt de merrie of hengst hem vóór die dag, dan telt hij nog mee.</p>';
  if(!list.length)return html+'<div class="empty">Er zijn nu geen drachtige merries.<br>Dekken doe je bij <b>💞 Dekken</b>.</div>';
  list.forEach(function(h){
    var n=daysUntil(h.bevalDatum),txt=n>1?"nog "+n+" dagen":n===1?"morgen":n===0?"vandaag!":"al "+(-n)+" dag"+(n===-1?"":"en")+" over tijd";
    var mare=sdgOf(h),st=find(byName(),h.drachtMet),v=(mare!==null&&st&&sdgOf(st)!==null)?(mare+sdgOf(st))/2:null;
    html+='<div class="stal"><div class="top"><span class="nm">♀ '+esc(h.name)+'</span><span class="days">'+txt+'</span></div>';
    html+='<div class="info">'+(h.drachtMet?'Van '+esc(h.drachtMet)+' · bevalt':'Bevalt')+' rond <b>'+nlDate(h.bevalDatum)+'</b>'+(v!==null?' · veulen ≥ '+f1(v)+' SDG':'')+'</div>';
    var stH=find(byName(),h.drachtMet);
    html+='<div class="info">Fokbonus nu: merrie '+fokLine(h,true)+(h.drachtMet?' hengst '+(stH?fokLine(stH,true)||'<span class="pill">onbekend</span>':'<span class="pill">onbekend</span>'):'')+'</div>';
    if(h.datumGok)html+='<div class="info"><span class="pill mid">⚠️ Datum geschat</span> De stalpagina zegt niet wanneer ze bevalt. <button class="link" onclick="changeDate(\''+h.id+'\')">Datum invullen</button></div>';
    var fm=fokInfo(h);if(fm.known&&!fm.full&&fm.next&&fm.next.steps.length)html+='<div class="info">💡 Wil je dat '+esc(h.name)+' de volle fokbonus meegeeft? Train dan vóór '+nlDate(h.bevalDatum)+' nog: <b>'+fm.next.steps.map(esc).join(", ")+'</b></div>';
    if(!h.drachtMet)html+='<div class="info">Hengst nog niet ingevuld. <button class="link" onclick="setHengst(\''+h.id+'\')">Invullen</button></div>';
    html+='<button class="big" onclick="S.foal={id:\''+h.id+'\',g:\'M\'};render();window.scrollTo(0,0)">🎉 Bevallen</button>';
    html+='<div class="row"><button class="link" onclick="changeDate(\''+h.id+'\')">Datum aanpassen</button><button class="link" style="text-align:right" onclick="nietDrachtig(\''+h.id+'\')">Toch niet drachtig</button></div></div>';
  });
  return html;
}
function setHengst(id){var h=D.horses.find(function(x){return x.id===id});dialog("Met welke hengst is "+h.name+" gedekt?",[{t:"Opslaan",f:function(n){if(!n.trim())return;h.drachtMet=n.trim();save();render()}},{t:"Annuleren",cls:"light"}],{value:""})}
function changeDate(id){var h=D.horses.find(function(x){return x.id===id});dialog("Wanneer bevalt "+h.name+"?",[{t:"Opslaan",f:function(n){if(!/^\d{4}-\d{2}-\d{2}$/.test(n))return;h.bevalDatum=n;delete h.datumGok;save();render()}},{t:"Annuleren",cls:"light"}],{type:"date",value:h.bevalDatum})}
function nietDrachtig(id){var h=D.horses.find(function(x){return x.id===id});ask(h.name+" is toch niet drachtig?","Klopt, niet drachtig",function(){delete h.drachtMet;delete h.dekDatum;delete h.bevalDatum;save();render()})}
function viewBevallen(){
  var mare=D.horses.find(function(h){return h.id===S.foal.id});
  var vg=D.groups.find(function(g){return norm(g.name).indexOf("veulen")===0})||D.groups[0];
  var html='<button class="link back" onclick="S.foal=null;render()">← Terug</button><div class="card"><h2 style="margin-top:0">🎉 Veulen van '+esc(mare.name)+'</h2>';
  html+='<p class="muted">Vader: '+esc(mare.drachtMet||"onbekend")+'</p>';
  html+='<label>Naam van het veulen</label><input id="f-name" autocomplete="off">';
  html+='<label>Merrie of hengst?</label><div class="seg"><button id="sx-M" class="on" onclick="S.foal.g=\'M\';this.className=\'on\';document.getElementById(\'sx-H\').className=\'\'">♀ Merrie</button><button id="sx-H" onclick="S.foal.g=\'H\';this.className=\'on\';document.getElementById(\'sx-M\').className=\'\'">♂ Hengst</button></div>';
  html+='<label>S / D / G</label><div class="row"><input id="f-S" inputmode="decimal" placeholder="S"><input id="f-D" inputmode="decimal" placeholder="D"><input id="f-G" inputmode="decimal" placeholder="G"></div>';
  html+='<label>In welke groep?</label><select id="f-group">'+D.groups.map(function(g){return '<option value="'+g.id+'"'+(vg&&g.id===vg.id?" selected":"")+'>'+esc(g.name)+'</option>'}).join("")+'</select>';
  html+='<button class="big" onclick="saveFoal()">💾 Veulen opslaan</button></div>';
  return html;
}
function saveFoal(){
  var mare=D.horses.find(function(h){return h.id===S.foal.id});var name=val("f-name");
  if(!name){info("Geef het veulen eerst een naam.");return}
  D.horses.push({id:uid(),name:name,g:S.foal.g,S:val("f-S"),D:val("f-D"),G:val("f-G"),sire:mare.drachtMet,dam:mare.name,groupId:val("f-group"),note:"geboren "+nlDate(today())});
  delete mare.drachtMet;delete mare.dekDatum;delete mare.bevalDatum;
  save();toast("Welkom "+name+"! 🐴");go("paarden");
}

/* ---- Back-up ---- */
function viewBackup(){
  var nSt=stallions().filter(function(x){return !x.eigen}).length;
  var html=viewDropbox()+'<h2>🐎 Hengstenbestand</h2><div class="card">';
  html+='<p>Lees hier het back-upbestand (.json) van de Stalmanager in. Daarmee krijg je de dekhengsten en de stambomen, zodat de app de inteelt kan uitrekenen.</p>';
  html+=D.db.length?'<p><b>Hengstenlijst van '+esc(D.dbDate)+'</b>: '+D.db.length+' paarden, waarvan '+nSt+' dekhengsten.</p>':'<p class="muted">Nog niets ingelezen.</p>';
  html+='<button class="big" onclick="document.getElementById(\'f-db\').click()">📂 Hengstenbestand inlezen</button><input type="file" id="f-db" accept=".json,application/json" style="display:none" onchange="importDb(this)">';
  html+='<p class="muted">Je eigen paarden blijven gewoon staan. Krijg je een nieuwer bestand, lees het dan opnieuw in.</p></div>';
  html+='<h2>💾 Mijn eigen back-up</h2><div class="card">';
  html+='<p>Alles staat in de browser op dit apparaat. Maak af en toe een back-up, dan raak je niets kwijt.</p>';
  html+='<button class="big" onclick="exportMine()">⬇️ Back-up downloaden</button>';
  html+='<button class="big light" onclick="document.getElementById(\'f-mine\').click()">⬆️ Back-up terugzetten</button><input type="file" id="f-mine" accept=".json,application/json" style="display:none" onchange="importMine(this)">';
  html+='</div>';
  var rasList=Array.from(new Set(D.db.map(function(h){return norm(h.ras)}).filter(Boolean)));
  if(rasList.length>1){
    html+='<h2>🐴 Rassen</h2><div class="card"><p>Van welke rassen wil je dekhengsten zien?</p>';
    S.rasList=rasList.sort();rasList.forEach(function(r,i){var on=D.rassen.some(function(x){return r.indexOf(x)===0});html+='<label style="font-weight:400"><input type="checkbox" style="width:auto;margin-right:8px"'+(on?" checked":"")+' onchange="toggleRas('+i+',this.checked)">'+esc(r.charAt(0).toUpperCase()+r.slice(1))+'</label>'});
    html+='</div>';
  }
  return html;
}
function toggleRas(i,on){var r=S.rasList[i];D.rassen=D.rassen.filter(function(x){return r.indexOf(x)!==0&&x!==r});if(on)D.rassen.push(r);save();render()}
function readFile(input,cb){var f=input.files&&input.files[0];input.value="";if(!f)return;var r=new FileReader();r.onload=function(){try{cb(JSON.parse(r.result))}catch(e){info("Dit bestand kon ik niet lezen. Is het een .json-bestand?")}};r.readAsText(f)}
function importDb(input){
  readFile(input,function(x){
    if(!x||(!Array.isArray(x.groups)&&!Array.isArray(x.externalHorses))){info("Dit lijkt geen back-up van de Stalmanager.");return}
    var out=[],seen={};
    function add(h,eigen){
      if(!h||!h.name||!String(h.name).trim())return;
      if(!h.stalnaam){var gm=String(h.name).trim().match(/^(.*[a-z\u00DF-\u00FF])([A-Z]{2,4})$/);if(gm)h=Object.assign({},h,{name:gm[1],stalnaam:gm[2]})}
      var S_=num(h.sdgS),D_=num(h.sdgD),G_=num(h.sdgG),tot=num(h.sdg);
      var dek=eigen?(h.gender==="H"&&h.status==="heart"):(h.dekhengst===true&&h.status!=="cross"&&h.status!=="warn");
      var k=norm(h.name)+"|"+norm(h.stalnaam||h.stal||"");
      var rec={name:String(h.name).trim(),g:h.gender==="H"?"H":"M",ras:h.ras||"",S:S_,D:D_,G:G_,sdg:tot!==null?tot:(S_!==null||D_!==null||G_!==null?(S_||0)+(D_||0)+(G_||0):null),sire:h.sireName||"",dam:h.damName||"",stal:eigen?(h.stalnaam||""):(h.stal||""),dekgeld:h.dekgeld?String(h.dekgeld):"",dek:!!dek,eigen:!!eigen,stalnaam:h.stalnaam||"",niv:h.niveaus||null,fok:!!(h.fokbonus||h.allround)};
      if(seen[k]!==undefined){var o=out[seen[k]];if(!o.sire&&rec.sire)o.sire=rec.sire;if(!o.dam&&rec.dam)o.dam=rec.dam;if(rec.dek)o.dek=true;return}
      seen[k]=out.length;out.push(rec);
    }
    (x.groups||[]).forEach(function(g){(g.subgroups||[]).forEach(function(sg){(sg.items||[]).forEach(function(it){if(it.kind==="horse")add(it,true)})})});
    (x.externalHorses||[]).forEach(function(h){add(h,false)});
    D.db=out;D.dbDate=nlDate(today());D.dbVer=today();D.dbSrc="bestand";save();render();
    var n=stallions().filter(function(s){return !s.eigen}).length;
    toast(out.length+" paarden ingelezen, "+n+" dekhengsten ✓");
  });
}
function exportMine(){
  var b=new Blob([JSON.stringify({stalboekje:1,groups:D.groups,horses:D.horses,ped:D.ped,rassen:D.rassen},null,1)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="stalboekje-backup-"+today()+".json";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}
function importMine(input){
  readFile(input,function(x){
    if(!x||!x.stalboekje||!Array.isArray(x.horses)){info("Dit is geen back-up van het Stalboekje.\n\nWil je het hengstenbestand inlezen? Gebruik dan de knop daarboven.");return}
    ask("Je huidige paarden vervangen door deze back-up ("+x.horses.length+" paarden)?","Ja, vervangen",function(){
    D.groups=x.groups||D.groups;D.horses=x.horses;D.ped=x.ped||D.ped;if(x.rassen)D.rassen=x.rassen;save();render();toast("Back-up teruggezet ✓")});
  });
}

render();
dbxStart();
</script>
</body>
</html>
